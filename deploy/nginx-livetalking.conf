# LiveTalking reverse proxy
# Copy to /etc/nginx/sites-available/livetalking and enable:
#   sudo ln -sf /etc/nginx/sites-available/livetalking /etc/nginx/sites-enabled/livetalking
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# LiveTalking stays on 127.0.0.1:8010 (listenport). Nginx only proxies HTTP/WS
# signaling; WebRTC media is still UDP between the browser and the app.
# Chromium microphone (voice input) needs HTTPS unless you open http://127.0.0.1.

upstream livetalking {
    server 127.0.0.1:8010;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
    proxy_buffering off;

    # FunASR WebSocket: PCM16 then is_speaking false → Qwen transcriptions
    location /api/asr {
        proxy_pass http://livetalking;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /sse {
        proxy_pass http://livetalking;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    location / {
        proxy_pass http://livetalking;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

